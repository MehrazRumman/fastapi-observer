[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-inspector"
version = "1.0.2"
description = "Structured request logging, observability middleware, and a built-in event dashboard for FastAPI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{ name = "Mehraz Hossain Rumman", email = "mehrazrumman@gmail.com" }]
keywords = [
  "fastapi",
  "starlette",
  "asgi",
  "logging",
  "structured-logging",
  "observability",
  "middleware",
  "monitoring",
  "request-logging",
  "correlation-id",
  "dashboard",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = [
  "fastapi>=0.100,<1.0",
  "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://mehrazrumman.github.io/fastapi-observer/"
Documentation = "https://mehrazrumman.github.io/fastapi-observer/"
Repository = "https://github.com/MehrazRumman/fastapi-observer"
Issues = "https://github.com/MehrazRumman/fastapi-observer/issues"
Changelog = "https://github.com/MehrazRumman/fastapi-observer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "httpx>=0.24",
  "httpx2>=2.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
]
dev = [
  "pre-commit>=3.7",
  "black>=26.5",
]

[tool.setuptools.packages.find]
include = ["fastapi_inspector*"]

[tool.setuptools.package-data]
fastapi_inspector = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.coverage.run]
source = ["fastapi_inspector"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
