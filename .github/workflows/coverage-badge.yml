name: Coverage Badge

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "assets/coverage.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          pytest -q --cov=fastapi_inspector --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        run: |
          mkdir -p assets
          python .github/scripts/generate_coverage_badge.py coverage.xml assets/coverage.svg

      - name: Commit updated badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update coverage badge [skip ci]"
          file_pattern: assets/coverage.svg
